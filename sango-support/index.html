<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="山郷サポート">
<meta name="theme-color" content="#244f37">
<title>山郷サポート</title>
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="icon" type="image/png" sizes="96x96" href="icon-96.png?v=3">
<link rel="stylesheet" href="style.css?v=19">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="backBtn" class="iconBtn" aria-label="戻る" hidden></button>
    <div id="topBrand" class="topBrand" hidden><span id="topLogo"></span></div>
    <h1 id="topTitle"></h1>
    <div class="topActions">
      <button id="bellBtn" class="iconBtn" aria-label="お知らせ"><span id="bellDot" class="bellDot" hidden></span></button>
      <button id="helpBtn" class="iconBtn" aria-label="使い方"></button>
      <button id="gearBtn" class="iconBtn" aria-label="設定"></button>
    </div>
  </header>
  <main id="main"></main>
  <nav id="tabbar">
    <a href="#/home" data-tab="home"><img class="tabIc" width="30" height="30" src="art/ic-home.webp?v=4" alt="" onload="this.parentNode.classList.add('hasIc')" onerror="this.remove()"><span data-icon="home"></span>ホーム</a>
    <a href="#/insp" data-tab="insp" id="tabInsp" hidden><img class="tabIc" width="30" height="30" src="art/ic-schedule.webp?v=4" alt="" onload="this.parentNode.classList.add('hasIc')" onerror="this.remove()"><span data-icon="check"></span>点検</a>
    <a href="#/mine" data-tab="mine"><img class="tabIc" width="30" height="30" src="art/ic-mine.webp?v=4" alt="" onload="this.parentNode.classList.add('hasIc')" onerror="this.remove()"><span data-icon="doc"></span>自分の症例</a>
  </nav>
</div>
<div id="tour" class="tour" hidden><div id="tourSpot" class="tourSpot"></div><div id="tourBubble" class="tourBubble"><div id="tourStep" class="tourStep"></div><div id="tourText" class="tourText"></div><div class="tourBtns"><button id="tourSkip" class="tourSkip">やめる</button><button id="tourNext" class="btn btnPrimary tourNext">次へ</button></div></div></div>
<div id="sheetRoot"></div>
<div id="lightbox" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="masterFile" accept=".json,application/json" hidden>
<input type="file" id="shootInput" accept="image/*" capture="environment" hidden>
<input type="file" id="pickInput" accept="image/*" multiple hidden>
<script src="sitemap.js?v=4"></script>
<script src="floorplan.js?v=3"></script>
<script src="app.js?v=37"></script>
<script src="login.js?v=4"></script>
<script src="guide.js?v=4"></script>
<script src="inspect.js?v=6"></script>
</body>
</html>
