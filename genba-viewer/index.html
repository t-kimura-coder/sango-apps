<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5ef">
<script>
// 表示の色（端末に合わせる／ライト／ダーク）。画面が出る前に決めて、白→黒のちらつきを防ぐ
try { var t = localStorage.getItem("genba-viewer-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<title>現場ナビ 見守り</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="96x96" href="icon-96.png?v=2">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="stylesheet" href="style.css?v=31">
</head>
<body>

<header class="appHeader">
  <a class="brand" href="#/home">
    <img src="icon-96.png?v=2" class="brandIcon" alt="">
    <span id="appName" class="brandName">現場ナビ 見守り</span><span class="brandTag">管理者ビューア</span>
  </a>
  <div class="headerSpacer"></div>
  <label class="headerSearch">
    <span data-icon="search"></span>
    <input id="globalSearch" type="search" placeholder="現場名・担当者名・疑問で検索" autocomplete="off">
    <div id="searchPanel" class="searchPanel" hidden></div>
  </label>
  <button id="reloadBtn" class="iconBtn" title="報告フォルダを読み直す" aria-label="読み直す"></button>
</header>

<div class="appBody">
  <nav class="sideNav">
    <a href="#/home" data-nav="home"><span data-icon="home"></span>ホーム</a>
    <a href="#/notes" data-nav="notes"><span data-icon="chat"></span>疑問・気づき<span id="navBadge" class="navBadge" hidden></span></a>
    <a href="#/weeks" data-nav="weeks"><span data-icon="calendar"></span>週の報告</a>
    <a href="#/meet" data-nav="meet"><span data-icon="people"></span>班の打合せ</a>
    <a href="#/sites" data-nav="sites"><span data-icon="user"></span>担当者</a>
    <a href="#/settings" data-nav="settings"><span data-icon="gear"></span>設定</a>
    <div id="sourceInfo" class="sourceInfo"></div>
  </nav>
  <main id="main" class="main"></main>
</div>
<!-- スマホ用の下のタブ（スマホ表示の時だけ出す） -->
<nav class="bottomNav">
  <a href="#/home" data-mnav="home"><span data-icon="home"></span>現場</a>
  <a href="#/notes" data-mnav="notes"><span data-icon="chat"></span>疑問・気づき<span class="navBadge mBadge" hidden></span></a>
  <a href="#/settings" data-mnav="settings"><span data-icon="gear"></span>設定</a>
</nav>

<!-- 返信を書く（右から開くパネル） -->
<div id="drawer" class="drawer" hidden>
  <div class="drawerBackdrop"></div>
  <aside class="drawerPanel" role="dialog" aria-label="返信を書く">
    <div class="drawerHead">
      <span data-icon="reply"></span>
      <div>
        <div class="drawerTitle">返信を書く</div>
        <div class="drawerSub">現場の疑問や相談に返信して、現場の作業をサポートしましょう。</div>
      </div>
      <button id="drawerClose" class="iconBtn" aria-label="閉じる"></button>
    </div>
    <div id="drawerBody" class="drawerBody"></div>
    <div id="drawerFoot" class="drawerFoot"></div>
  </aside>
</div>

<div id="lightbox" class="lightbox" hidden><button id="lightboxPrev" class="lbNav prev" type="button" aria-label="前の写真">‹</button><img id="lightboxImg" alt=""><button id="lightboxNext" class="lbNav next" type="button" aria-label="次の写真">›</button><div id="lightboxCap" class="lbCap"></div></div>
<div id="toast" class="toast" hidden></div>
<input id="folderInput" type="file" webkitdirectory multiple hidden>

<script src="demo.js?v=2"></script>
<script src="mobile.js?v=3"></script>
<script src="app.js?v=41"></script>
</body>
</html>
